[package]
name = "cli-music-player"
version = "3.0.0"
edition = "2024"
description = "TUI music player for Navidrome/Subsonic servers"

[dependencies]
# Audio
symphonia = { version = "0.6.1", features = ["mp3", "flac", "ogg", "aac", "wav", "alac", "pcm"] }
cpal = "0.18.2"
rubato = "0.16.2"

# HTTP / Async
reqwest = { version = "0.13.5", features = ["json", "stream", "rustls", "blocking", "query"] }
tokio = { version = "1.54.1", features = ["full"] }

# TUI
ratatui = "0.30.2"
crossterm = "0.29.0"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Crypto
pbkdf2 = "0.13.0"
sha2 = "0.11.1"
aes-gcm = "0.11.1"
md-5 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"

# Misc
rand = "0.10.3"
dirs = "5.0.1"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
hostname = "0.4.2"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.deb]
maintainer = "krabhi4"
section = "sound"
priority = "optional"
depends = "libasound2"
assets = [
    ["target/release/cli-music-player", "usr/bin/", "755"],
]
